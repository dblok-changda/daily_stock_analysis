# ===================================
# Anote - Docker Compose
# ===================================
#
# note:
#   note: docker-compose -f ./docker/docker-compose.yml up -d
#   FastAPInote: docker-compose -f ./docker/docker-compose.yml up -d server
#   note: docker-compose -f ./docker/docker-compose.yml up -d analyzer server

name: daily-stock-analysis
version: '3.8'

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped

  # note（note .env filesnote）。note ../.env notefiles volume note /app/.env，
  # note Docker mount point noteconfigurationnote os.replace note。
  env_file:
    - ../.env

  volumes:
    - ../data:/app/data
    - ../logs:/app/logs
    - ../reports:/app/reports
    - ../strategies:/app/strategies:ro
    # Longbridge OAuth token cache persistence; entrypoint repairs container-side ownership for dsa user.
    # Create ../longbridge_tokens on the host before copying an authorized token cache into it.
    - ../longbridge_tokens:/home/dsa/.longbridge
    # note，note static directories
    # - ../static:/app/static:ro

  environment:
    - TZ=Asia/Shanghai

    # Web/API service bind address (must be 0.0.0.0 inside container)
    - WEBUI_HOST=0.0.0.0
    # API_PORT note .env filesnote，note

    # note（ifrequires）
    # - http_proxy=http://host.docker.internal:10809
    # - https_proxy=http://host.docker.internal:10809
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  # note：note 1G+；512M note Web/API、note、note，
  # note MAX_WORKERS=1 note analyzer note server。
  deploy:
    resources:
      limits:
        memory: 1G
      reservations:
        memory: 512M

services:
  # note
  analyzer:
    <<: *common
    container_name: stock-analyzer

  # FastAPI note
  server:
    <<: *common
    container_name: stock-server
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    # note network_mode: host，note ports note，note command note --port note
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
