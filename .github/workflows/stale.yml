name: Mark and close stale issues and PRs

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print actions without applying changes"
        required: false
        default: "false"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Clean stale content
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues and PRs
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 7
          days-before-issue-close: 7
          days-before-pr-stale: 21
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,good first issue,help wanted
          exempt-pr-labels: pinned,security,work in progress,dependencies
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: true
          debug-only: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
          stale-issue-message: |
            This issue has had no activity for 7 days.

            Please check whether it needs updated reproduction steps, confirmation
            against the latest version, or clearer expected behavior. If the issue
            is resolved, you can close it directly. If it still exists, reply with
            the latest status and we will continue to follow up.
          close-issue-message: |
            This issue was closed automatically because it had no activity for a
            long time. If it still exists, reopen it or create a new issue with
            updated context.
          stale-pr-message: |
            This PR has had no activity for 21 days.

            If you still want these changes merged, update the code, resolve merge
            conflicts, and reply with the latest status. Draft PRs and PRs with
            excluded labels are not marked stale.
          close-pr-message: |
            This PR was closed automatically because it had no activity for a long
            time. If you want to continue, reopen it after updating the branch or
            create a new PR.
